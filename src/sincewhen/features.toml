# The four types whose method tables no release in the source corpus
# carries. Nothing from 0.9.1 to 2.5 implements a type anyone would call
# `bytes`, `bytearray`, `memoryview` or `range`, so `typemethods.py`
# leaves them out and `type_is_covered` says so out loud. What answers
# for them instead is the rule that closes a module member's bound one
# level up: a method cannot predate the type that holds it.
#
# For `memoryview` that closes on its own and `dating.py` derives it: the
# 2.7 inventory is the oldest that indexes `tolist`, and 2.7 is when
# `memoryview` arrived, so there is nothing under the bound.
#
# For `bytes` and `bytearray` it does not, because the inventory does not
# get round to indexing their methods until 3.4 for most of them, and 3.0,
# 3.1 or 3.13 for the rest, which is the age of the markup rather than of
# the methods. Each entry below says which release indexes it. So those
# carry manual evidence, resting on three things:
#
#   - Both types arrived in 2.6, and 2.6's `bytes` is a synonym for
#     `str`. That is the same reading that dates the b"..." literal to
#     2.6 rather than to PEP 3112's own 3.0 header.
#   - Every string method below is already dated on `str` at 2.5 or
#     earlier, so the types are the binding constraint and not the
#     methods. The one exception is `decode`, which has no `str` entry
#     because Python 3 kept it on the byte types only, and which the 2.6
#     inventory indexes under `str`. This is the clamp the `bytes`
#     exclusion exists for: the 2.x string table would date
#     `bytes.capitalize` to 1.6, five releases before anything could be
#     spelled b"...".
#   - Nothing announces adding one later. Every later addition to these
#     types is named by a whatsnew or carries a marker of its own, and
#     each has its own entry: `maketrans` 3.1, `copy` and `clear` 3.3,
#     `hex` 3.5, `isascii` 3.7, `removeprefix` and `removesuffix` 3.9,
#     `resize` 3.14. The last of those is why this says "or carries a
#     marker": no whatsnew mentions `bytearray.resize` at all.
#
# `fromhex` is the one method both types have whose ages differ, so
# `bytes.fromhex` sits with the 3.0 entries below rather than here. The
# other seven `bytearray`-only entries are methods `bytes` never had.

[[features]]
id = "bytearray-append"
name = "bytearray.append()"
added = "2.6"
category = "method"
methods = ["bytearray.append"]

[features.evidence]
method = "manual"
note = "bytearray arrived in 2.6 with the mutable sequence methods. The 2.6 What's New names append(), pop() and reverse() and calls the rest \"some of the methods of lists\", and no release since announces adding one. The 3.13 inventory is the first to index any of them, which is the age of the markup. See the note above the bytes and bytearray group."
checked = "2026-07-30"

