[[features]]
id = "angle-inequality"
name = "<> inequality operator"
added = "0.9"
category = "syntax"
removed = "3.0"
spellings = ["<>"]

[features.evidence]
method = "manual"
note = "0.9, not the 1.0 the grammar's vocabulary reports. 0.9.1 writes the rule `comp_op: '<'|'>'|'='|'>' '='|'<' '='|'<' '>'|...`, spelling this as two adjacent single-character terminals, and 1.0 rewrites it as `'<'|'>'|'=='|'>='|'<='|'<>'|'!='|...`. So `'<>'` first appears as a terminal in 1.0 and the diff dates the tokenizer change rather than the spelling. The 0.9.1 interpreter built from that release's own tarball accepts `1 <> 2`, which is what settles it. `>=` and `<=` are the same shape and are not in the dataset."
checked = "2026-08-08"

[features.removed_evidence]
method = "manual"
note = "The 3.0 whatsnew lists it under Removed Syntax: \"Removed <> (use != instead)\", and the built interpreters agree: 2.7 accepts `1 <> 2` and 3.0 rejects it. The grammar cannot settle this one and would answer wrongly if asked: PEP 401 put the token back into every 3.x pgen grammar from 3.1 to 3.9 so that `from __future__ import barry_as_FLUFL` could re-enable it, so the parser knows a token the compiler rejects. This is the counter-example to a grammar diff settling a removal, and the only one in this dataset."
checked = "2026-08-08"

[[features]]
id = "single-equals-equality"
name = "= as the equality operator"
added = "0.9"
category = "syntax"
removed = "1.0"
spellings = ["="]

[features.evidence]
method = "manual"
note = "0.9.1 spells equality `=`, and could without ambiguity, because assignment is a statement there and never an expression: its `comp_op` rule is `'<'|'>'|'='|'>' '='|'<' '='|'<' '>'|...`. Dated from the first public release, so it is at least that old and may predate the public record."
checked = "2026-08-08"

[features.removed_evidence]
method = "manual"
note = "1.0 rewrote `comp_op` as `'<'|'>'|'=='|'>='|'<='|'<>'|'!='|...`, dropping `=` and adding `==`. The built interpreters confirm both halves: 0.9.1 accepts `1 = 1` and rejects `1 == 1`, and 1.0 does the reverse. No grammar diff can see this, because `'='` is still a terminal in every later grammar as the assignment operator, so what changed is the body of one rule rather than the vocabulary. This is the removal the terminal diff is structurally unable to reach, and the same limit keeps `raise E, v` and `except E, name` out of the dataset."
checked = "2026-08-08"

