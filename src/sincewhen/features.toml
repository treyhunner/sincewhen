# Removed in Python 3.0, and dated on both axes. See the note above the
# builtin removals, and "The removal axis" in AGENTS.md.
#
# `added` here is a claim about instances and `removed` is a claim about
# both spellings, which is not an inconsistency but the one place the two
# axes read the same mask differently. `{}.has_key(k)` works from 0.9 and
# `dict.has_key` as an unbound attribute needs 2.2, because `dict` was not
# a type before then; the type method tables date the first and the
# interpreters answer for the second. For the removal the two agree, and
# agree for a reason: a type that loses a method loses it on instances and
# as an unbound attribute in the same release, and every removal here is
# 3.0.

[[features]]
id = "dict-has-key"
name = "dict.has_key()"
added = "0.9"
category = "method"
removed = "3.0"
methods = ["dict.has_key"]

[features.evidence]
method = "source"
symbol = "dict.has_key"
file = "src/dictobject.c"
present_in = "0.9"
note = "Registered in 0.9, the oldest source release there is, so it is at least that old and may be older."
checked = "2026-08-08"

[features.removed_evidence]
method = "interpreter"
symbol = "dict.has_key"
present_in = "2.7"
absent_in = "3.0"
note = "Replaced by the `in` operator, which works on a dict from 2.2."
checked = "2026-08-08"

