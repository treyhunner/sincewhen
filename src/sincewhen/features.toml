# --------------------------------------------------------------------
# Methods on builtin types
# --------------------------------------------------------------------
#
# Two methods date these and neither is an inventory diff, because
# `stdtypes` documents a whole family of types in one table and Sphinx
# grew per-name markup for those tables release by release. The release
# that first indexes `list.copy` is 3.13; the method arrived in 3.3. See
# the note on `BUILTIN_TYPES` in scripts/dating.py.
#
# The 3.x era is dated by the docs' own markers. The ancient methods
# never got one, because they predate the convention, so those come from
# the type's own method table in CPython's source, which is the list the
# type registers its methods from. See scripts/typemethods.py.
#
# A pre-2.6 entry is a claim about instances rather than about the type.
# `str` was a builtin function and not a class until 2.2, so `"x".split()`
# is 1.6 and `str.split` as an unbound attribute is 2.2.
#
# Most of these are searchable rather than detectable. `x.removeprefix()`
# says nothing about `x`, so only a receiver whose type is certain
# reports one: a literal, or the type's own name.
#
# Anything Python 3 removed is left out, for the reason the Python 2
# builtins are: `added` cannot say "and then taken away again". So
# `str.decode`, `dict.iteritems` and `dict.viewkeys` have no entries.

[[features]]
id = "dict-keys"
name = "dict.keys()"
added = "0.9"
category = "method"
methods = ["dict.keys"]

[features.evidence]
method = "source"
symbol = "dict.keys"
file = "src/dictobject.c"
present_in = "0.9"
note = "Registered in 0.9, the oldest source release there is, so it is at least that old and may be older."
checked = "2026-07-29"

