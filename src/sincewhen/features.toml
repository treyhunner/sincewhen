[[features]]
id = "dis-contains-op"
name = "dis.CONTAINS_OP"
added = "3.14"
category = "function"
attributes = ["dis.CONTAINS_OP"]

[features.evidence]
method = "manual"
note = "The opcode is 3.9 and this name is 3.14. The docs write it `.. opcode:: CONTAINS_OP`, which the text build renders unqualified under the `dis` heading, so the marker gets attached to a dotted name the docs never claimed. `Lib/dis.py` binds a module-level constant only for the opcodes it needs itself, and `CONTAINS_OP = opmap['CONTAINS_OP']` first appears in 3.14; the built interpreters agree, and 3.14's predecessor resolves it in no micro release either. The name as spelled is what the entry claims, because dating it 3.9 put a floor under `minimum_version()` for code that raises `AttributeError` until 3.14. The opcode's own age is recorded here."
checked = "2026-07-30"

