id = "os-direntry"
name = "os.DirEntry"
added = "3.6"
category = "class"
attributes = ["os.DirEntry"]

[features.evidence]
method = "manual"
note = "The docs and the 3.5 inventory both date the class to 3.5, and the name is 3.6. The type exists in 3.5, since `scandir()` yields it, but nothing in 3.5 binds it under a name: `Modules/posixmodule.c` gains `PyModule_AddObject(m, \"DirEntry\", ...)` in 3.6 and has no such call in 3.5, and the 3.5 interpreter resolves neither `os.DirEntry` nor `posix.DirEntry`. Two sources agreeing on the release the name arrived in is what settles this against a marker that is dating the class rather than the attribute."
checked = "2026-07-30"

