# The sincewhen feature dataset.
#
# Each entry records one detectable feature and the Python version that
# introduced it. Matchers are declarative:
#
#   nodes       AST node class names that signal the feature
#   requires    name of a node attribute that must be truthy
#   check       name of a predicate registered in detect.py
#   builtins    builtin names whose use signals the feature
#   modules     stdlib modules whose import signals the feature
#   attributes  dotted names (module.attr) whose use signals the feature
#   methods     methods of builtin types (type.method), which are always
#               searchable and are only detected on a receiver whose type
#               is certain: a literal, or the type's own name
#   spellings   ways of writing something that this parser cannot produce
#               a node for, because a later Python took the syntax away.
#               Searchable and never detectable: `<>`, the print
#               statement, backticks
#
# Every entry needs exactly one matcher kind. Documentation links are
# generated from `added` and `pep`, so only set `docs` to override.
#
# An entry that also carries `removed` is one Python has taken away, and
# it makes two claims rather than one: `added` is the oldest release it
# has been available in ever since, and `removed` is the oldest release
# it has been unavailable in ever since. Both are read off the same
# presence mask from the same end. See "The removal axis" in AGENTS.md.
#
# Every entry also carries a [features.evidence] table saying how its
# version was established, and `just verify-dataset` re-derives all of
# them from archived documentation. Do not edit a version without
# editing its evidence: the two are checked against each other in CI. A
# `removed` claim carries a [features.removed_evidence] table of its own,
# and only three methods may fill it in: the built interpreters, the
# grammar, and `manual`. A removal is an absence claim, so the methods
# whose absences prove nothing cannot make one.
#
# The generated entries here came from `scripts/propose.py`, which reads
# the version out of the docs rather than taking anyone's word for it.
# Curation notes live in AGENTS.md.


# --------------------------------------------------------------------
# Syntax
# --------------------------------------------------------------------

[[features]]
id = "containment-check"
name = "containment check (in, not in)"
added = "0.9"
category = "syntax"
nodes = ["Compare"]
check = "has_containment"

[features.evidence]
method = "grammar"
symbol = "'in'"
present_in = "0.9"
note = "`comp_op` in the 0.9.1 grammar is '<'|'>'|'='|'>' '='|'<' '='|'<' '>'|'in'|'not' 'in'|'is'|'is' 'not', so both spellings are in the first public release and nothing can date them further back. `not in` has no token of its own to check, being `'not' 'in'` in that same rule. Only the operator is this old: `key in some_dict` is a TypeError until 2.2, and `'ab' in 'abc'` until 2.3, neither of which an AST can see."
checked = "2026-07-29"

[[features]]
id = "tuple-unpacking"
name = "tuple unpacking (a, b = 1, 2)"
added = "0.9"
category = "syntax"
nodes = ["Tuple", "List"]
check = "has_tuple_target"

[features.evidence]
method = "grammar"
symbol = "exprlist"
present_in = "0.9"
note = "0.9.1's `expr_stmt: (exprlist '=')* exprlist` is what makes a comma-separated target legal, and `exprlist` is in the first public release, so this cannot be dated. There is no token named for the feature, so the rule is what gets checked. The 0.9.1 interpreter runs `a, b = 1, 2`, the `a, b = b, a` swap, a nested `a, (b, c) = 1, (2, 3)` and `for a, b in pairs`."
checked = "2026-07-29"

[[features]]
id = "dict-display-items"
name = "dict display with items ({'k': 1})"
added = "1.0"
category = "syntax"
nodes = ["Dict"]
check = "has_dict_items"

[features.evidence]
method = "grammar"
symbol = "dictmaker"
absent_in = "0.9"
present_in = "1.0"
note = "0.9.1's `atom` spells a dict `'{' '}'` with nothing allowed between the braces and its grammar has no `dictmaker` rule at all, so the empty display is as old as Python and a display with items is not. 1.0 adds `dictmaker: test ':' test (',' test ':' test)* [',']` and makes `atom` read `'{' [dictmaker] '}'`. Only the pairs are claimed here: `{**a}` is a `Dict` with a `None` key and belongs to the 3.5 entry."
checked = "2026-07-30"

[[features]]
id = "equality-operator"
name = "equality operator (==)"
added = "1.0"
category = "syntax"
nodes = ["Compare"]
check = "has_equality"

[features.evidence]
method = "grammar"
symbol = "'=='"
absent_in = "0.9"
present_in = "1.0"
note = "0.9.1's comp_op spells equality `=`, which is unambiguous there because assignment is a statement and never an expression: the 0.9.1 interpreter runs `if 1 = 1:` and rejects `if 1 == 1:`, and `x = (1 = 2)` assigns 0. Its token table has no EQEQUAL at all, so `==` could not even be lexed. 1.0 added `==` and `!=`, dropped `=` as a comparison, and made `>=`, `<=` and `<>` single tokens rather than two adjacent ones, so 0.9.1 also accepts `if 1 > = 0:` and 1.0 does not."
checked = "2026-07-29"

[[features]]
id = "inequality-operator"
name = "inequality operator (!=)"
added = "1.0"
category = "syntax"
nodes = ["Compare"]
check = "has_inequality"

[features.evidence]
method = "grammar"
symbol = "'!='"
absent_in = "0.9"
present_in = "1.0"
note = "Added by the same 1.0 grammar change as `==`, alongside `<>`, which lasted until 3.0 removed it: the 0.9.1 interpreter rejects `if 1 != 2:` and runs `if 1 <> 2:`, and 0.9.1's token table has no NOTEQUAL. Only `!=` is detectable, since a 3.14 parser cannot produce a node for `<>` at all."
checked = "2026-07-29"

[[features]]
id = "lambda"
name = "lambda expression"
added = "1.0"
category = "syntax"
nodes = ["Lambda"]

[features.evidence]
method = "grammar"
symbol = "'lambda'"
absent_in = "0.9"
present_in = "1.0"
note = "Python 0.9.1 has no lambda: its grammar has no lambdef rule, and the lambda calculus example in its own library builds currying out of classes instead. The 1.0 grammar's changelog records \"added lambdef\"."
checked = "2026-07-28"

[[features]]
id = "call-unpacking"
name = "unpacking at a call (f(*args), f(**kwargs))"
added = "1.6"
category = "syntax"
nodes = ["Call"]
check = "has_call_unpacking"

[features.evidence]
method = "manual"
note = "1.5's `arglist:  argument (',' argument)* [',']` has nowhere to put a star, and 1.6's `arglist: (argument ',')* (argument [',']| '*' test [',' '**' test] | '**' test)` adds both spellings in one line, which is why they are one entry. The 1.5 interpreter raises SyntaxError on `f(*args)` and on `f(**kw)` and the 1.6 one runs both; `apply(f, args)` was the spelling before. This cannot be grammar evidence because `grammar.py` indexes token and rule names and the change is inside a rule body: `arglist` and `argument` are both 1.3, `'*'` is 0.9 as multiplication and `'**'` is 1.4 as exponentiation, and `--version 1.6` reports no new tokens at all. Diffing rule bodies would date the grammar's factoring rather than the language, since 3.5 moved `'*' test` out of `arglist` and into `argument`. Collecting is older and a different node: `def f(*args)` is the 1.0 `varargslist` and `def f(**kwargs)` the 1.5 one."
checked = "2026-07-30"

