# Removed syntax, which is searchable and never detectable.
#
# A 3.14 parser cannot produce a node for any of these, so there is
# nothing for a matcher to fire on and `spellings` says so in the schema:
# it puts the name in the search index and builds no detector. Shipping
# old parsers to detect them is a separate project.
#
# What settles these is the grammar, which is the list the parser is
# generated from rather than a description of one, so a token missing
# from it is a token that release cannot parse. `<>` is the exception
# that earns the `manual` escape hatch: see its note.

[[features]]
id = "print-statement"
name = "print statement"
added = "0.9"
category = "syntax"
removed = "3.0"
spellings = ["print"]

[features.evidence]
method = "grammar"
symbol = "'print'"
present_in = "0.9"
checked = "2026-08-08"

[features.removed_evidence]
method = "grammar"
symbol = "'print'"
present_in = "2.7"
absent_in = "3.0"
note = "PEP 3105. Searchable and not detectable: `print x` is a syntax error to the parser this tool runs on, so no node for it can ever reach the matcher. The print() function that replaced it has its own entry, dated 3.0."
