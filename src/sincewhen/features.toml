# Removed in Python 3.0, and dated on both axes.
#
# `added` and `removed` are read off the same presence mask, from the
# same end: `added` is the oldest release a name has been available in
# ever since, and `removed` is the oldest release it has been unavailable
# in ever since. See "The removal axis" in AGENTS.md.
#
# Each of these is detectable for free. `apply(f, args)` parses under a
# 3.14 parser and the builtins matcher fires on it exactly as it does for
# a name that is still there, so old code reports the whole story in one
# line. `callable()` is deliberately not here: it went away in 3.0 and
# came back in 3.2, which under this dataset's own rule is a gap rather
