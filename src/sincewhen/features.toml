[[features]]
id = "os-mknod"
name = "os.mknod()"
added = "2.3"
category = "function"
attributes = ["os.mknod"]

[features.evidence]
method = "manual"
note = "The 2.7 docs say \"New in version 2.3\" and the built interpreters resolve it only from 2.7, and the docs are right. `posixmodule.c` guards the table row with `#if defined(HAVE_MKNOD) && defined(HAVE_MAKEDEV)`, and 2.6's `configure` probes for `makedev` in `<sys/types.h>` alone, where glibc 2.28 no longer defines it: the generated `pyconfig.h` has `HAVE_MKNOD` and not `HAVE_MAKEDEV`, while 2.7's has both because its `configure` carries a second probe. The absence is a 2018 header move and not 2003 history."
checked = "2026-07-30"

