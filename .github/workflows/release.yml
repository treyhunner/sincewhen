name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: write  # Creating the GitHub release
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        run: |
          test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      # Before publishing, because publishing to PyPI cannot be undone
      # and a release with nothing to say about itself is worth catching
      # while the tag is still the only thing that exists.
      - name: Read the release notes out of the changelog
        run: |
          uv run scripts/changelog.py "${GITHUB_REF_NAME#v}" > notes.md

      # The same command CI runs, so a release cannot ship something
      # CI would have rejected. Pushing a tag does not wait on CI.
      - run: uv run pytest -v --cov=sincewhen --cov=tests --cov-report=term-missing

      - run: uv build

      - run: uv publish --trusted-publishing always

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file notes.md dist/*
