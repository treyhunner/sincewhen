name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv run pytest -v --cov=sincewhen --cov=tests --cov-report=term-missing

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache the documentation corpus
        uses: actions/cache@v4
        with:
          path: .cache
          key: docs-${{ hashFiles('scripts/sources.sha256') }}
      - name: Fetch anything the cache is missing
        run: uv run scripts/fetch_docs.py
      - name: Check the corpus matches the committed hashes
        run: uv run scripts/fetch_docs.py --check
      - name: Check the release dates against python.org
        run: uv run scripts/release_dates.py --check
      # Reads the committed interpreter table, so this needs no compiler
      # and no Docker: it fails if the dataset has drifted from what the
      # built interpreters last reported.
      - name: Check the dataset against the built interpreters
        run: uv run scripts/interpreters.py --check
      - name: Re-derive every version claim
        run: uv run scripts/verify_dataset.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check the wheel ships the feature dataset
        run: |
          uv build
          wheel="$(ls -t dist/*.whl | head -1)"
          unzip -l "$wheel" | grep -q 'sincewhen/features.toml'
